<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Workout Log</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
@font-face{font-family:Barlow;font-style:normal;font-weight:400 500;font-display:swap;src:url('fonts/Barlow-Regular.ttf') format('truetype')}
@font-face{font-family:Barlow;font-style:normal;font-weight:600 700;font-display:swap;src:url('fonts/Barlow-SemiBold.ttf') format('truetype')}
@font-face{font-family:Barlow;font-style:normal;font-weight:800 900;font-display:swap;src:url('fonts/Barlow-ExtraBold.ttf') format('truetype')}
:root {
  --bg:#0D0D16; --sf:#141420; --sf2:#1C1C2A; --sf3:#242434;
  --bdr:rgba(255,255,255,.07); --bdr2:rgba(255,255,255,.13);
  --ac:#00E5A0; --acd:rgba(0,229,160,.14); --acb:rgba(0,229,160,.25);
  --aw:#FF6B4A; --warn:#FFB800;
  --t1:#F0F0F8; --t2:#8888A0; --t3:#48485A;
  --r:14px; --rs:10px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:light){:root{
  --bg:#F0F0F6; --sf:#FFFFFF; --sf2:#EAEAF2; --sf3:#DEDEE8;
  --bdr:rgba(0,0,0,.07); --bdr2:rgba(0,0,0,.13);
  --ac:#009E72; --acd:rgba(0,158,114,.11); --acb:rgba(0,158,114,.22);
  --aw:#D94E2A; --warn:#C48A00;
  --t1:#0D0D18; --t2:#5C5C72; --t3:#9898AA
}}
:root[data-theme=dark]{--bg:#0D0D16;--sf:#141420;--sf2:#1C1C2A;--sf3:#242434;--bdr:rgba(255,255,255,.07);--bdr2:rgba(255,255,255,.13);--ac:#00E5A0;--acd:rgba(0,229,160,.14);--acb:rgba(0,229,160,.25);--aw:#FF6B4A;--warn:#FFB800;--t1:#F0F0F8;--t2:#8888A0;--t3:#48485A}
:root[data-theme=light]{--bg:#F0F0F6;--sf:#FFFFFF;--sf2:#EAEAF2;--sf3:#DEDEE8;--bdr:rgba(0,0,0,.07);--bdr2:rgba(0,0,0,.13);--ac:#009E72;--acd:rgba(0,158,114,.11);--acb:rgba(0,158,114,.22);--aw:#D94E2A;--warn:#C48A00;--t1:#0D0D18;--t2:#5C5C72;--t3:#9898AA}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);font-family:'Barlow',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto;position:relative}

/* HEADER */
.hdr{padding:calc(var(--st) + 14px) 18px 10px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10;border-bottom:1px solid var(--bdr)}
.hdr-date{font-size:12px;color:var(--t2);letter-spacing:.3px;margin-bottom:1px}
.hdr-title{font-size:19px;font-weight:800;color:var(--t1);letter-spacing:-.3px}
.hdr-right{display:flex;align-items:center;gap:8px}
.streak{display:flex;align-items:center;gap:5px;background:var(--acd);border:1px solid var(--acb);border-radius:20px;padding:5px 11px;font-size:13px;font-weight:700;color:var(--ac)}
.streak svg{width:14px;height:14px}
.icon-btn{width:34px;height:34px;border-radius:50%;background:var(--sf2);border:1px solid var(--bdr);color:var(--t2);display:flex;align-items:center;justify-content:center}
.icon-btn svg{width:18px;height:18px}

/* SCROLL */
.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(72px + var(--sb))}
.scroll-area::-webkit-scrollbar{display:none}

/* TAB BAR */
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:calc(60px + var(--sb));padding-bottom:var(--sb);background:var(--sf);border-top:1px solid var(--bdr);display:flex;z-index:20}
.tab-btn{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--t3);transition:color .2s;padding-top:6px}
.tab-btn.active{color:var(--ac)}
.tab-btn svg{width:22px;height:22px}
.tab-btn span{font-size:10px;font-weight:700;letter-spacing:.4px}

.view{display:none}
.view.active{display:block}

/* TODAY: TOP AREA */
.today-banner{padding:16px 16px 10px}
.today-h{font-size:24px;font-weight:800;color:var(--t1);letter-spacing:-.5px}
.today-sub{font-size:13px;color:var(--t2);margin-top:3px}
.today-sub strong{color:var(--ac)}

/* SUMMARY */
.summary{display:flex;gap:8px;padding:0 16px 14px}
.chip{flex:1;background:var(--sf);border:1px solid var(--bdr);border-radius:var(--rs);padding:11px 6px;text-align:center}
.chip-val{font-size:20px;font-weight:800;color:var(--t1);font-variant-numeric:tabular-nums;line-height:1}
.chip-val.g{color:var(--ac)}
.chip-lbl{font-size:10px;color:var(--t2);margin-top:3px;letter-spacing:.4px}

/* SETTINGS ROW */
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px}
.settings-label{font-size:12px;color:var(--t2);font-weight:600;letter-spacing:.4px}
.sets-stepper{display:flex;align-items:center;gap:8px}
.ss-btn{width:26px;height:26px;border-radius:7px;background:var(--sf);border:1px solid var(--bdr);color:var(--t1);font-size:16px;font-weight:300;display:flex;align-items:center;justify-content:center}
.ss-val{font-size:14px;font-weight:800;color:var(--t1);font-variant-numeric:tabular-nums;min-width:18px;text-align:center}

/* ══════════════════════════════════
   TABLE LAYOUT
══════════════════════════════════ */
.ex-table-wrap{padding:0 16px;margin-bottom:14px}

/* Table container */
.ex-table{background:var(--sf);border:1px solid var(--bdr);border-radius:var(--r);overflow:hidden}

/* Column header */
.ex-table-head{display:flex;align-items:center;background:var(--sf2);border-bottom:1px solid var(--bdr);padding:7px 14px;gap:0}
.th-left{width:128px;flex-shrink:0;font-size:10px;font-weight:800;color:var(--t3);letter-spacing:.7px;text-transform:uppercase}
.th-div{width:1px;background:var(--bdr);height:14px;margin-right:12px}
.th-right{flex:1;font-size:10px;font-weight:800;color:var(--t3);letter-spacing:.7px;text-transform:uppercase}

/* Exercise row */
.ex-row{display:flex;align-items:flex-start;border-bottom:1px solid var(--bdr);transition:background .2s;min-height:52px}
.ex-row:last-child{border-bottom:none}
.ex-row.row-done{background:rgba(0,229,160,.03)}

/* LEFT CELL */
.ex-left{width:128px;flex-shrink:0;padding:10px 0 10px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px;border-right:1px solid var(--bdr)}
.ex-name-row{display:flex;align-items:center;gap:6px}
.ex-ico{font-size:15px;line-height:1;flex-shrink:0}
.ex-name{font-size:13px;font-weight:700;color:var(--t1);line-height:1.2}
.ex-meta{display:flex;align-items:center;gap:4px;margin-top:3px;flex-wrap:wrap}
.ex-tag{font-size:9px;color:var(--t3);background:var(--sf2);border-radius:3px;padding:1px 5px;letter-spacing:.2px}
.ex-tgt{font-size:9px;color:var(--ac);font-weight:700;font-variant-numeric:tabular-nums}

/* RIGHT CELL */
.ex-right{flex:1;padding:9px 12px;display:flex;flex-direction:column;gap:6px;justify-content:center}

/* Chips row: completed + pending dots */
.set-chips{display:flex;flex-wrap:wrap;align-items:center;gap:4px}

/* Completed set chip */
.chip-done{background:var(--acd);border:1px solid var(--acb);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums;cursor:pointer;transition:opacity .15s;flex-shrink:0;line-height:1.2}
.chip-done:active{opacity:.7}
.chip-done .chip-sub{font-size:9px;font-weight:500;color:var(--ac);opacity:.7;margin-left:1px}

/* Pending set dot */
.dot-pending{width:7px;height:7px;border-radius:50%;background:var(--sf3);flex-shrink:0}

/* Active set stepper row */
.set-active{display:flex;align-items:center;gap:4px}
.set-label{font-size:10px;font-weight:700;color:var(--t2);min-width:34px;letter-spacing:.2px;flex-shrink:0}
.stp-btn{width:26px;height:26px;border-radius:7px;background:var(--sf2);border:1px solid var(--bdr);color:var(--t1);font-size:16px;font-weight:300;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .1s,transform .1s}
.stp-btn:active{background:var(--sf3);transform:scale(.9)}
.stp-num{min-width:26px;text-align:center;font-size:16px;font-weight:800;color:var(--t1);font-variant-numeric:tabular-nums}
.stp-unit{font-size:10px;color:var(--t2);flex-shrink:0}
.ok-btn{background:var(--ac);color:#000;border:none;border-radius:7px;padding:5px 10px;font-size:11px;font-weight:800;letter-spacing:.3px;flex-shrink:0;transition:opacity .15s,transform .1s;line-height:1.2}
.ok-btn:active{opacity:.82;transform:scale(.95)}

/* All done state */
.row-done-mark{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ac);font-weight:700}
.row-done-mark svg{width:14px;height:14px}

/* Add set */
.add-set-link{background:none;border:none;color:var(--t3);font-size:11px;display:flex;align-items:center;gap:3px;padding:0;line-height:1}
.add-set-link:hover{color:var(--t2)}
.add-set-link svg{width:11px;height:11px}

/* COMPLETE BANNER */
.complete-banner{margin:0 16px 14px;background:var(--acd);border:1px solid var(--acb);border-radius:var(--r);padding:18px;text-align:center}
.complete-emoji{font-size:32px;margin-bottom:6px}
.complete-h{font-size:18px;font-weight:800;color:var(--ac);margin-bottom:3px}
.complete-sub{font-size:12px;color:var(--t2)}

/* EXERCISE TOGGLE */
.ex-toggle-section{padding:12px 16px 0}
.ex-toggle-title{font-size:11px;color:var(--t2);font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
.ex-toggle-grid{display:flex;flex-wrap:wrap;gap:6px}
.ex-toggle-chip{border:1px solid var(--bdr2);border-radius:20px;padding:5px 11px;font-size:11px;font-weight:600;color:var(--t2);background:var(--sf);transition:all .2s}
.ex-toggle-chip.on{background:var(--acd);border-color:var(--acb);color:var(--ac)}

/* ── HISTORY ── */
.history-wrap{padding:16px}
.section-hdr{font-size:11px;font-weight:800;color:var(--t2);letter-spacing:.7px;text-transform:uppercase;margin-bottom:10px}
.history-item{background:var(--sf);border:1px solid var(--bdr);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer}
.history-date{background:var(--sf2);border-radius:8px;padding:7px 10px;text-align:center;flex-shrink:0}
.hd-month{font-size:9px;color:var(--t2);letter-spacing:.5px;text-transform:uppercase}
.hd-day{font-size:22px;font-weight:800;color:var(--t1);font-variant-numeric:tabular-nums;line-height:1}
.history-info{flex:1;min-width:0}
.history-exercises{font-size:13px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-meta{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}
.hm{font-size:11px;color:var(--t2)}
.hm strong{color:var(--ac);font-variant-numeric:tabular-nums}
.chevron{color:var(--t3)}
.chevron svg{width:15px;height:15px}
.empty-msg{text-align:center;color:var(--t3);font-size:14px;padding:40px 20px}
.history-detail{background:var(--sf2);border:1px solid var(--bdr);border-top:none;border-radius:0 0 var(--rs) var(--rs);padding:8px 14px;margin-top:-8px;margin-bottom:8px}
.hd-ex-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--bdr);font-size:12px}
.hd-ex-row:last-child{border-bottom:none}
.hd-ex-name{color:var(--t1);font-weight:600}
.hd-ex-val{color:var(--ac);font-weight:700;font-variant-numeric:tabular-nums}

/* ── STATS ── */
.stats-wrap{padding:16px}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.kpi{background:var(--sf);border:1px solid var(--bdr);border-radius:var(--rs);padding:14px}
.kpi-val{font-size:28px;font-weight:800;color:var(--t1);font-variant-numeric:tabular-nums;line-height:1}
.kpi-val.ac{color:var(--ac)}
.kpi-lbl{font-size:11px;color:var(--t2);margin-top:5px;letter-spacing:.2px}
.chart-card{background:var(--sf);border:1px solid var(--bdr);border-radius:var(--rs);padding:16px;margin-bottom:12px}
.chart-title{font-size:11px;font-weight:800;color:var(--t2);letter-spacing:.6px;text-transform:uppercase;margin-bottom:14px}
.bar-chart{display:flex;align-items:flex-end;gap:5px;height:88px}
.bc-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bc-bar{width:100%;border-radius:4px 4px 0 0;min-height:3px;transition:height .6s cubic-bezier(.4,0,.2,1)}
.bc-bar.today-bar{background:var(--ac)}
.bc-bar.past-bar{background:var(--sf3)}
.bc-lbl{font-size:9px;color:var(--t3);font-variant-numeric:tabular-nums}
.pr-card{background:var(--sf);border:1px solid var(--bdr);border-radius:var(--rs);overflow:hidden;margin-bottom:12px}
.pr-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bdr)}
.pr-row:last-child{border-bottom:none}
.pr-ico{font-size:16px;flex-shrink:0;width:24px;text-align:center}
.pr-name{flex:1;font-size:13px;font-weight:600;color:var(--t1)}
.pr-val{font-size:15px;font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums}
.pr-unit{font-size:10px;color:var(--t2);margin-left:2px}
.pr-default{color:var(--t3)}
.muscle-card{background:var(--sf);border:1px solid var(--bdr);border-radius:var(--rs);padding:16px;margin-bottom:12px}
.muscle-row{margin-bottom:10px}
.muscle-row:last-child{margin-bottom:0}
.muscle-hdr{display:flex;justify-content:space-between;margin-bottom:5px}
.muscle-name{font-size:12px;color:var(--t1);font-weight:600}
.muscle-pct{font-size:12px;color:var(--ac);font-weight:700;font-variant-numeric:tabular-nums}
.muscle-track{height:5px;background:var(--sf2);border-radius:3px;overflow:hidden}
.muscle-bar{height:100%;background:var(--ac);border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}

/* REST TIMER */
.rest-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;padding:0 16px calc(16px + var(--sb));animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.rest-card{background:var(--sf);border:1px solid var(--bdr2);border-radius:24px;padding:26px 24px 22px;width:100%;max-width:398px;text-align:center}
.rest-ttl{font-size:11px;font-weight:800;color:var(--t2);letter-spacing:.8px;text-transform:uppercase;margin-bottom:12px}
.rest-num{font-size:68px;font-weight:800;color:var(--t1);font-variant-numeric:tabular-nums;line-height:1;margin-bottom:14px;transition:color .3s}
.rest-num.urgent{color:var(--aw)}
.rest-track{height:4px;background:var(--sf2);border-radius:2px;overflow:hidden;margin-bottom:18px}
.rest-prog{height:100%;background:var(--ac);border-radius:2px;transition:width .9s linear}
.rest-prog.urgent{background:var(--aw)}
.rest-btns{display:flex;gap:10px}
.rest-add{flex-shrink:0;padding:13px 16px;border-radius:14px;background:var(--sf2);border:1px solid var(--bdr);color:var(--t2);font-size:13px;font-weight:700}
.rest-skip{flex:1;padding:13px;border-radius:14px;background:var(--ac);border:none;color:#000;font-size:14px;font-weight:800;letter-spacing:.2px}

/* TOAST */
.toast{position:fixed;top:calc(var(--st) + 62px);left:50%;transform:translateX(-50%);background:var(--sf2);border:1px solid var(--bdr2);border-radius:12px;padding:9px 16px;font-size:13px;font-weight:600;color:var(--t1);z-index:200;white-space:nowrap;animation:toastIn .25s ease,toastOut .25s ease 1.5s forwards;pointer-events:none}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(-8px)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* Compact mobile workout controls */
button,input,select{font:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.icon-btn{width:32px;min-width:32px;height:32px}
.ss-btn,.stp-btn{width:28px;min-width:28px;height:32px}
.settings-row{gap:8px;flex-wrap:wrap}
.settings-label{font-size:12px}
.settings-label small{display:block;color:var(--t2);font-weight:400;margin-top:4px}
.ex-row{align-items:stretch}
.ex-left{width:112px;padding:12px 8px 12px 10px}
.th-left{width:98px}
.ex-name-row{align-items:flex-start}
.ex-name{line-height:1.35;word-break:normal;overflow-wrap:break-word}
.ex-tag{color:var(--t2)}
.th-left,.th-right,.bc-lbl{color:var(--t2)}
.ex-tgt,.previous-note{font-size:11px;line-height:1.5}
.previous-note{color:var(--t2);margin-top:4px}
.ex-right{min-width:0;padding:10px;gap:8px}
.set-active{display:grid;grid-template-columns:28px minmax(28px,1fr) 28px 46px;gap:4px}
.set-label{grid-column:1/-1;font-size:11px}
.stp-num{width:100%;min-width:0;height:32px;border:1px solid var(--bdr2);border-radius:6px;background:var(--sf2);color:var(--t1);font-size:15px;appearance:textfield}
.stp-num::-webkit-inner-spin-button{appearance:none}
.ok-btn{min-height:32px;padding:5px 6px;font-size:11px;background:var(--acd);color:var(--ac);border:1px solid var(--acb);border-radius:6px}
.edit-actions{grid-column:1/-1;display:flex;gap:6px}
.edit-actions button{flex:1;min-height:30px;border:0;background:none;color:var(--t2);font-size:11px}
.chip-done{min-height:30px;padding:4px 7px;border:0;background:none}
.saved-set{display:inline-flex;align-items:center;background:var(--acd);border:1px solid var(--acb);border-radius:6px}
.set-undo{min-height:30px;padding:4px 7px;border:0;border-left:1px solid var(--acb);background:none;color:var(--t2);font-size:10px}
.row-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.add-set-link,.input-cancel{min-height:30px;color:var(--t2)}
.input-cancel{border:0;background:none;padding:0;font-size:11px}
.ex-toggle-chip{min-height:32px}
.hint{font-size:12px;color:var(--t2);line-height:1.6;margin:0 16px 12px}
.progress-track{height:5px;background:var(--sf3);margin:0 16px 10px;border-radius:5px;overflow:hidden}
.progress-fill{height:100%;background:var(--ac)}
.rest-overlay{position:absolute;inset:auto 12px calc(68px + var(--sb));padding:0;background:none;backdrop-filter:none;display:block;z-index:25}
.rest-card{display:grid;grid-template-columns:1fr auto;gap:8px;max-width:none;border-radius:14px;padding:12px 14px;text-align:left;box-shadow:0 4px 20px #0003}
.rest-ttl{margin:0;font-size:11px}
.rest-num{font-size:28px;margin:0;grid-column:2;grid-row:1/3}
.rest-track{grid-column:1;margin:0;align-self:center}
.rest-btns{grid-column:1/-1;gap:8px}
.rest-add,.rest-skip{padding:7px;min-height:32px;border-radius:8px;font-size:12px}
.resting .scroll-area{padding-bottom:calc(210px + var(--sb))}
.period-tabs{display:flex;gap:4px;background:var(--sf2);padding:4px;border-radius:12px;margin-bottom:12px}
.period-tabs button{flex:1;min-height:34px;border:0;background:none;border-radius:8px;color:var(--t2);font-weight:700}
.period-tabs button[aria-pressed=true]{background:var(--sf);color:var(--ac)}
.period-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;font-size:12px}
.period-nav button{min-width:32px;height:32px;border:1px solid var(--bdr);border-radius:8px;background:var(--sf);color:var(--t1)}
button:disabled{opacity:.35;cursor:default}
.stats-table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.stats-table th,.stats-table td{padding:12px 4px;border-bottom:1px solid var(--bdr);text-align:right}
.stats-table th:first-child,.stats-table td:first-child{text-align:left;width:48%}
.stats-table th{color:var(--t2);font-size:11px}
.stats-table td{line-height:1.5}
.bar-chart{height:128px}
.bc-value{font-size:10px;color:var(--t2);font-variant-numeric:tabular-nums}
.history-item{width:100%;text-align:left;font:inherit;color:inherit}
.backup-btn{width:100%;min-height:34px;background:var(--sf);border:1px solid var(--bdr2);border-radius:10px;color:var(--t2);font-size:13px}
.cumulative-details{margin-bottom:14px}
.cumulative-details summary{min-height:44px;padding:12px 0;color:var(--t2);font-size:13px;cursor:pointer}
.toast{white-space:normal;width:max-content;max-width:calc(100% - 32px);text-align:center}
.toast.action-toast{display:flex;align-items:center;gap:12px;pointer-events:auto;animation:toastIn .2s ease}
.toast button{border:0;background:none;color:var(--ac);font-size:12px;padding:6px}
</style>

<div id="app">
  <header class="hdr">
    <div>
      <div class="hdr-date" id="hdr-date"></div>
      <div class="hdr-title">Workout Log</div>
    </div>
    <div class="hdr-right">
      <div class="streak" id="hdr-streak">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5.67s.74 2.65.74 4.8c0 2.06-1.35 3.73-3.41 3.73-2.07 0-3.63-1.67-3.63-3.73l.03-.36C5.21 7.51 4 10.62 4 14c0 4.42 3.58 8 8 8s8-3.58 8-8C20 8.61 17.41 3.8 13.5.67z"/></svg>
        <span id="streak-num">0</span>d
      </div>
      <button class="icon-btn" id="theme-btn" aria-label="Switch theme">
        <svg id="theme-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </header>

  <div id="view-today" class="view active scroll-area"><div id="today-content"></div></div>
  <div id="view-history" class="view scroll-area"><div id="history-content"></div></div>
  <div id="view-stats" class="view scroll-area"><div id="stats-content"></div></div>

  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="today">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2.05v2.02c3.95.49 7 3.85 7 7.93 0 3.21-1.81 6-4.72 7.72L13 17v5h5l-1.22-1.22C19.91 19.07 22 15.76 22 12c0-5.18-3.95-9.45-9-9.95zM11 2.05C5.95 2.55 2 6.82 2 12c0 3.76 2.09 7.07 5.22 8.78L6 22h5V2.05z"/></svg>
      <span>Workout</span>
    </button>
    <button class="tab-btn" data-tab="history">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zm0-13H5V5h14v1zM7 10h5v5H7z"/></svg>
      <span>History</span>
    </button>
    <button class="tab-btn" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
      <span>Stats</span>
    </button>
  </nav>

  <div id="rest-overlay" style="display:none" class="rest-overlay" role="region" aria-label="Rest timer">
    <div class="rest-card">
      <div class="rest-ttl">Rest timer</div>
      <div class="rest-num" id="rest-num">60</div>
      <div class="rest-track"><div class="rest-prog" id="rest-prog" style="width:100%"></div></div>
      <div class="rest-btns">
        <button class="rest-add" id="rest-add-btn">+30s</button>
        <button class="rest-skip" id="rest-skip-btn">Skip rest</button>
      </div>
    </div>
  </div>
</div>

<script>
const EXERCISES = [
  {id:'shoulderpress',name:'Shoulder Press',ico:'🏋️',tags:['Shoulders'],def:12,muscles:['Shoulders','Triceps']},
  {id:'latpulldown',name:'Lat Pulldown',ico:'💪',tags:['Back'],def:12,muscles:['Back','Biceps']},
  {id:'reardelt',name:'Rear Delt Machine',ico:'🔄',tags:['Shoulders','Back'],def:12,muscles:['Shoulders','Back']},
  {id:'legextension',name:'Seated Leg Extension',ico:'🦵',tags:['Quads'],def:12,muscles:['Thighs']},
  {id:'legcurl',name:'Leg Curl',ico:'🦿',tags:['Hamstrings'],def:12,muscles:['Thighs','Hamstrings']},
  {id:'legpress',name:'Leg Press',ico:'🦵',tags:['Lower body'],def:12,muscles:['Thighs','Glutes']},
  {id:'armcurl',name:'Arm Curl Machine',ico:'💪',tags:['Biceps'],def:12,muscles:['Biceps']},
];
const EX_MAP = Object.fromEntries(EXERCISES.map(e=>[e.id,e]));
const DEFAULT_ACTIVE = EXERCISES.map(e=>e.id);
function exerciseName(id){return EX_MAP[id]?.name||({pushup:'Push-ups',squat:'Squats',lunge:'Lunges',plank:'Plank',burpee:'Burpees',mountain:'Mountain Climbers',dip:'Triceps Dips',legraise:'Leg Raises',crunch:'Crunches',bridge:'Glute Bridge',jumpjack:'Jumping Jacks',inchworm:'Inchworms'}[id])||'Previous Exercise';}

function dateKey(d=new Date()){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function prevDayKey(k){const d=new Date(k+'T00:00');d.setDate(d.getDate()-1);return dateKey(d)}
function formatDateKR(k){return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',weekday:'short'}).format(new Date(k+'T00:00'));}
function formatMonthDay(k){const d=new Date(k+'T00:00');const m=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];return{m:m[d.getMonth()],d:d.getDate()}}

function loadData(){try{return JSON.parse(localStorage.getItem('homefit_v2')||'{}')}catch{return{}}}
function saveData(d){try{localStorage.setItem('homefit_v2',JSON.stringify(d));return true;}catch{showToast('Could not save. Check your browser storage.');return false;}}

let DATA=loadData();
if(!DATA.days) DATA.days={};
if(!DATA.settings) DATA.settings={sets:3,restTime:60,active:[...DEFAULT_ACTIVE]};
if(!DATA.settings.active) DATA.settings.active=[...DEFAULT_ACTIVE];
if(DATA.settings.active.some(id=>!EX_MAP[id])){DATA.settings.active=[...DEFAULT_ACTIVE];saveData(DATA);}
const TODAY=dateKey();
let editingSet=null;

function previousRecord(id){
  for(const k of Object.keys(DATA.days).filter(k=>k<TODAY).sort().reverse()){
    const done=DATA.days[k].exercises?.[id]?.sets.filter(s=>s.done)||[];
    if(done.length)return{date:k,max:Math.max(...done.map(s=>s.reps))};
  }
  return null;
}
function adjustSets(delta){
  const count=Math.min(10,Math.max(1,DATA.settings.sets+delta));
  DATA.settings.sets=count;
  DATA.settings.active.forEach(id=>{
    const ex=DATA.days[TODAY].exercises[id];
    while(ex.sets.length<count)ex.sets.push({reps:ex.target,done:false});
    while(ex.sets.length>count){const i=ex.sets.findLastIndex(s=>!s.done);if(i<0)break;ex.sets.splice(i,1);}
  });
  editingSet=null;saveData(DATA);renderToday();
}

function ensureToday(){
  if(!DATA.days[TODAY]){
    const prev=DATA.days[prevDayKey(TODAY)];
    const exData={};
    DATA.settings.active.forEach(id=>{
      const ex=EX_MAP[id];if(!ex)return;
      let target=ex.def;
      if(prev?.exercises?.[id]){
        const ps=prev.exercises[id].sets.filter(s=>s.done);
        if(ps.length>0) target=Math.max(...ps.map(s=>s.reps));
      }
      exData[id]={sets:Array.from({length:DATA.settings.sets},()=>({reps:target,done:false})),target,nextReps:target};
    });
    DATA.days[TODAY]={exercises:exData,startTime:Date.now(),endTime:null};
    saveData(DATA);
  } else {
    const day=DATA.days[TODAY];
    let changed=false;
    DATA.settings.active.forEach(id=>{
      if(!day.exercises[id]){
        const ex=EX_MAP[id];if(!ex)return;
        const prev=DATA.days[prevDayKey(TODAY)];
        let target=ex.def;
        if(prev?.exercises?.[id]){const ps=prev.exercises[id].sets.filter(s=>s.done);if(ps.length>0)target=Math.max(...ps.map(s=>s.reps));}
        day.exercises[id]={sets:Array.from({length:DATA.settings.sets},()=>({reps:target,done:false})),target,nextReps:target};
        changed=true;
      }
    });
    if(changed)saveData(DATA);
  }
}

function getPR(id){
  let max=null;
  Object.values(DATA.days).forEach(day=>{
    day.exercises?.[id]?.sets.filter(s=>s.done).forEach(s=>{if(max===null||s.reps>max)max=s.reps;});
  });
  return max;
}
function getStreak(){
  let streak=0,d=new Date(TODAY+'T00:00');
  for(let i=0;i<365;i++){
    const k=dateKey(d);
    const day=DATA.days[k];
    const hasWork=day&&Object.values(day.exercises||{}).some(e=>e.sets.some(s=>s.done));
    if(!hasWork){if(k===TODAY){d.setDate(d.getDate()-1);continue;}break;}
    streak++;d.setDate(d.getDate()-1);
  }
  return streak;
}
function getTodayStats(){
  const day=DATA.days[TODAY];
  if(!day)return{sets:0,reps:0,exDone:0,total:0};
  let sets=0,reps=0,exDone=0,total=0;
  DATA.settings.active.forEach(id=>{
    const ex=day.exercises[id];if(!ex)return;
    total++;const done=ex.sets.filter(s=>s.done);
    sets+=done.length;reps+=done.reduce((a,s)=>a+s.reps,0);
    if(done.length===ex.sets.length&&ex.sets.length>0)exDone++;
  });
  return{sets,reps,exDone,total};
}

// REST TIMER
let restState=null;
function startRest(duration){
  if(restState){clearInterval(restState.iv);restState=null;}
  const overlay=document.getElementById('rest-overlay');
  const numEl=document.getElementById('rest-num');
  const progEl=document.getElementById('rest-prog');
  overlay.style.display='block';
  document.body.classList.add('resting');
  let deadline=Date.now()+duration*1000,total=duration;
  function tick(){
    const remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));
    numEl.textContent=remaining;
    numEl.className='rest-num'+(remaining<=10?' urgent':'');
    progEl.style.width=`${(remaining/total)*100}%`;
    progEl.className='rest-prog'+(remaining<=10?' urgent':'');
    if(remaining<=0){endRest();return;}
  }
  tick();
  restState={iv:setInterval(tick,1000)};
  document.getElementById('rest-add-btn').onclick=()=>{deadline+=30000;total+=30;tick();};
  document.getElementById('rest-skip-btn').onclick=endRest;
}
function endRest(){
  if(restState){clearInterval(restState.iv);restState=null;}
  document.getElementById('rest-overlay').style.display='none';
  document.body.classList.remove('resting');
}

// TABS
let currentTab='today';
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false');});
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById(`view-${tab}`).classList.add('active');
  if(tab==='today') renderToday();
  else if(tab==='history') renderHistory();
  else renderStats();
}

// THEME
function applyTheme(t){
  if(t) document.documentElement.setAttribute('data-theme',t);
  else document.documentElement.removeAttribute('data-theme');
  const isDark=t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.getElementById('theme-ico').innerHTML=isDark
    ?'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
    :'<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
}
document.getElementById('theme-btn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const isDark=cur==='dark'||(!cur&&window.matchMedia('(prefers-color-scheme:dark)').matches);
  DATA.settings.theme=isDark?'light':'dark';applyTheme(DATA.settings.theme);saveData(DATA);
};

function showToast(msg,undo){
  document.querySelectorAll('.toast').forEach(el=>el.remove());
  const t=document.createElement('div');
  t.className='toast';t.setAttribute('role','status');t.textContent=msg;
  if(undo){t.classList.add('action-toast');const btn=document.createElement('button');btn.textContent='Undo';btn.onclick=()=>{t.remove();undo();};t.appendChild(btn);}
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),undo?6000:2000);
}
function cancelCompletedSet(id,idx){
  const ex=DATA.days[TODAY].exercises[id],set=ex.sets[idx];
  if(!set?.done)return;
  set.done=false;ex.nextReps=set.reps;DATA.days[TODAY].endTime=null;
  editingSet=null;endRest();saveData(DATA);renderToday();updateHeader();showToast('Set save undone.');
}

/* ═══════════════════════════════════
   RENDER TODAY — TABLE LAYOUT
═══════════════════════════════════ */
function renderToday(){
  ensureToday();
  const day=DATA.days[TODAY];
  const stats=getTodayStats();
  const allDone=stats.exDone===stats.total&&stats.total>0;
  const active=DATA.settings.active;
  const planned=active.reduce((n,id)=>n+(day.exercises[id]?.sets.length||0),0);

  let html=`<div class="today-banner">
    <div class="today-h">${formatDateKR(TODAY)}</div>
    <div class="today-sub">${active.length} exercises · Saved when you log a set</div>
  </div>
  <div class="summary">
    <div class="chip"><div class="chip-val g">${stats.exDone}/${stats.total}</div><div class="chip-lbl">Exercises done</div></div>
    <div class="chip"><div class="chip-val">${stats.sets}</div><div class="chip-lbl">Sets logged</div></div>
    <div class="chip"><div class="chip-val">${stats.reps.toLocaleString()}</div><div class="chip-lbl">Total reps</div></div>
  </div><div class="progress-track" role="progressbar" aria-label="Today’s set progress" aria-valuenow="${stats.sets}" aria-valuemin="0" aria-valuemax="${planned}"><div class="progress-fill" style="width:${planned?stats.sets/planned*100:0}%"></div></div>
  <p class="hint">${stats.sets} / ${planned} sets logged · Adjust reps and tap Save.</p>`;

  if(allDone){
    html+=`<div class="complete-banner"><div class="complete-emoji">🎉</div><div class="complete-h">Workout complete!</div><div class="complete-sub">${stats.reps} reps · ${stats.sets} sets logged</div></div>`;
  }

  html+=`<div class="settings-row">
    <div class="settings-label">Today’s sets<small>Logged sets stay saved.</small></div>
    <div class="sets-stepper">
      <button class="ss-btn" id="sets-minus" aria-label="Decrease today’s sets" ${DATA.settings.sets<=1?'disabled':''}>−</button>
      <div class="ss-val" id="sets-val">${DATA.settings.sets}</div>
      <button class="ss-btn" id="sets-plus" aria-label="Increase today’s sets" ${DATA.settings.sets>=10?'disabled':''}>+</button>
    </div>
  </div>`;

  /* ── TABLE ── */
  html+=`<div class="ex-table-wrap"><div class="ex-table">
    <div class="ex-table-head">
      <div class="th-left">Exercise</div>
      <div class="th-div"></div>
      <div class="th-right">Set log</div>
    </div>`;

  active.forEach(id=>{
    const ex=EX_MAP[id];if(!ex)return;
    const exData=day.exercises[id];if(!exData)return;
    const doneSets=exData.sets.filter(s=>s.done);
    const cardDone=doneSets.length===exData.sets.length&&exData.sets.length>0;
    const unit=ex.isTime?'s':' reps';
    const nextIdx=exData.sets.findIndex(s=>!s.done);
    const previous=previousRecord(id);
    const isEditing=editingSet?.id===id;
    const inputIdx=isEditing?editingSet.idx:nextIdx;
    const inputReps=isEditing?exData.sets[inputIdx].reps:(exData.nextReps||exData.target);

    /* LEFT CELL */
    const leftHtml=`<div class="ex-left">
      <div class="ex-name-row">
        <span class="ex-ico">${ex.ico}</span>
        <span class="ex-name">${ex.name}</span>
      </div>
      <div class="ex-meta">
        ${ex.tags.map(t=>`<span class="ex-tag">${t}</span>`).join('')}
        <span class="ex-tgt">Target ${exData.target}${unit}</span>
      </div>
      ${previous?`<div class="previous-note">Last best ${previous.max}${unit}<br>${formatDateKR(previous.date)}</div>`:''}
    </div>`;

    /* RIGHT CELL */
    let rightHtml=`<div class="ex-right">`;

    /* Chips row: done sets + pending dots */
    rightHtml+=`<div class="set-chips">`;
    exData.sets.forEach((s,i)=>{
      if(s.done){
        rightHtml+=`<span class="saved-set"><button class="chip-done" data-id="${id}" data-idx="${i}" aria-label="Edit ${ex.name} set ${i+1}, ${s.reps}${unit}">${i+1} · ${s.reps}<span class="chip-sub">${unit}</span></button><button class="set-undo" data-undo="${id}" data-idx="${i}" aria-label="Undo ${ex.name} set ${i+1}">Undo</button></span>`;
      } else if(i!==nextIdx){
        rightHtml+=`<span class="dot-pending"></span>`;
      }
    });
    rightHtml+=`</div>`;

    /* Active set stepper or done mark */
    if(cardDone&&!isEditing){
      rightHtml+=`<div class="row-done-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        Done · Best ${Math.max(...doneSets.map(s=>s.reps))}${unit}
      </div>`;
    } else if(inputIdx!==-1){
      rightHtml+=`<div class="set-active">
        <div class="set-label">${isEditing?'Editing · ':''}Set ${inputIdx+1} / ${exData.sets.length} · ${unit.trim()}</div>
        <button class="stp-btn" data-id="${id}" data-action="minus" aria-label="${ex.name} decrease reps">−</button>
        <input class="stp-num" id="reps-${id}" data-id="${id}" type="number" inputmode="numeric" min="1" max="999" step="1" value="${inputReps}" aria-label="${ex.name} reps">
        <button class="stp-btn" data-id="${id}" data-action="plus" aria-label="${ex.name} increase reps">+</button>
        <button class="ok-btn" data-id="${id}" aria-label="${ex.name} ${isEditing?'Save edit':'Log set'}">Save</button>
        ${isEditing?`<div class="edit-actions"><button data-cancel="${id}">Cancel edit</button></div>`:''}
      </div>`;
    }

    /* Add set link */
    rightHtml+=`<div class="row-actions"><button class="add-set-link" data-id="${id}" aria-label="${ex.name} Add set">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Add set
    </button>${!isEditing&&nextIdx!==-1?`<button class="input-cancel" data-reset="${id}" aria-label="${ex.name} Reset input">Reset input</button>`:''}</div>`;

    rightHtml+=`</div>`;

    html+=`<div class="ex-row${cardDone?' row-done':''}" data-id="${id}">${leftHtml}${rightHtml}</div>`;
  });

  html+=`</div></div>`; /* close table */

  /* Exercise toggle */
  html+=`<div class="ex-toggle-section">
    <div class="ex-toggle-title">Choose today’s exercises</div>
    <div class="ex-toggle-grid">`;
  EXERCISES.forEach(ex=>{
    html+=`<button class="ex-toggle-chip${active.includes(ex.id)?' on':''}" data-ex="${ex.id}" aria-pressed="${active.includes(ex.id)}">${ex.ico} ${ex.name}</button>`;
  });
  html+=`</div></div><div style="height:20px"></div>`;

  document.getElementById('today-content').innerHTML=html;
  bindTodayEvents();
}

function bindTodayEvents(){
  document.getElementById('sets-minus').onclick=()=>adjustSets(-1);
  document.getElementById('sets-plus').onclick=()=>adjustSets(1);
  document.querySelectorAll('.stp-btn').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.id,action=btn.dataset.action;
      const ex=DATA.days[TODAY].exercises[id];
      const input=document.getElementById(`reps-${id}`);
      const cur=Number(input.value)||ex.target;
      const step=EX_MAP[id].isTime?5:1;
      input.value=Math.min(999,Math.max(1,action==='plus'?cur+step:cur-step));
      if(editingSet?.id!==id){ex.nextReps=Number(input.value);saveData(DATA);}
    };
  });
  document.querySelectorAll('.stp-num').forEach(input=>{
    input.onchange=()=>{
      const n=Number(input.value);
      if(Number.isInteger(n)&&n>=1&&n<=999&&editingSet?.id!==input.dataset.id){DATA.days[TODAY].exercises[input.dataset.id].nextReps=n;saveData(DATA);}
    };
    input.onkeydown=event=>{if(event.key==='Enter')document.querySelector(`.ok-btn[data-id="${input.dataset.id}"]`).click();};
  });
  document.querySelectorAll('.ok-btn').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.id;
      const ex=DATA.days[TODAY].exercises[id];
      const isEditing=editingSet?.id===id;
      const idx=isEditing?editingSet.idx:ex.sets.findIndex(s=>!s.done);if(idx===-1)return;
      const input=document.getElementById(`reps-${id}`);
      const reps=Number(input.value);
      if(!Number.isInteger(reps)||reps<1||reps>999){showToast('Enter a whole number from 1 to 999.');input.focus();return;}
      const before={set:{...ex.sets[idx]},nextReps:ex.nextReps,endTime:DATA.days[TODAY].endTime};
      ex.sets[idx]={reps,done:true};
      if(!isEditing)ex.nextReps=reps;
      editingSet=null;
      if(DATA.settings.active.every(id=>DATA.days[TODAY].exercises[id].sets.every(s=>s.done)))
        DATA.days[TODAY].endTime=Date.now();
      const saved=saveData(DATA);
      renderToday();updateHeader();
      if(saved)showToast(`Set ${idx+1} · ${reps} reps ${isEditing?'updated':'saved'}`,()=>{
        ex.sets[idx]=before.set;ex.nextReps=before.nextReps;DATA.days[TODAY].endTime=before.endTime;
        editingSet=null;endRest();saveData(DATA);renderToday();updateHeader();showToast(isEditing?'Edit undone.':'Set save undone.');
      });
      if(!isEditing&&!ex.sets.every(s=>s.done))startRest(DATA.settings.restTime||60);
    };
  });
  document.querySelectorAll('.chip-done').forEach(chip=>{
    chip.onclick=()=>{
      const id=chip.dataset.id,idx=parseInt(chip.dataset.idx);
      editingSet={id,idx};renderToday();
    };
  });
  document.querySelectorAll('[data-cancel]').forEach(btn=>btn.onclick=()=>{editingSet=null;renderToday();});
  document.querySelectorAll('[data-undo]').forEach(btn=>btn.onclick=()=>{
    cancelCompletedSet(btn.dataset.undo,Number(btn.dataset.idx));
  });
  document.querySelectorAll('[data-reset]').forEach(btn=>btn.onclick=()=>{
    const ex=DATA.days[TODAY].exercises[btn.dataset.reset];ex.nextReps=ex.target;
    saveData(DATA);renderToday();showToast('Input reset to your target.');
  });
  document.querySelectorAll('.add-set-link').forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.id;
      const ex=DATA.days[TODAY].exercises[id];
      ex.sets.push({reps:ex.target,done:false});
      saveData(DATA);renderToday();
    };
  });
  document.querySelectorAll('.ex-toggle-chip').forEach(chip=>{
    chip.onclick=()=>{
      const id=chip.dataset.ex;
      const active=DATA.settings.active;
      const idx=active.indexOf(id);
      if(idx>=0){if(active.length<=1){showToast('Select at least one exercise.');return;}active.splice(idx,1);}
      else active.push(id);
      editingSet=null;saveData(DATA);ensureToday();renderToday();
    };
  });
}

/* ─── HISTORY ─── */
let expandedDay=null;
function renderHistory(){
  const days=Object.entries(DATA.days)
    .filter(([,day])=>Object.values(day.exercises||{}).some(e=>e.sets.some(s=>s.done)))
    .sort(([a],[b])=>b.localeCompare(a));
  if(!days.length){
    document.getElementById('history-content').innerHTML=`<div class="history-wrap"><div class="empty-msg">No workouts yet.<br>Log your first set today. 💪</div></div>`;
    return;
  }
  let html=`<div class="history-wrap"><div class="section-hdr">Workout Log</div>`;
  days.forEach(([k,day])=>{
    const exs=Object.entries(day.exercises||{});
    const totalReps=exs.reduce((a,[id,e])=>a+(id==='plank'?0:e.sets.filter(s=>s.done).reduce((b,s)=>b+s.reps,0)),0);
    const totalSeconds=exs.filter(([id])=>id==='plank').reduce((a,[,e])=>a+e.sets.filter(s=>s.done).reduce((b,s)=>b+s.reps,0),0);
    const totalSets=exs.reduce((a,[,e])=>a+e.sets.filter(s=>s.done).length,0);
    const exNames=exs.filter(([,e])=>e.sets.some(s=>s.done)).map(([id])=>exerciseName(id));
    const {m,d}=formatMonthDay(k);const isExp=expandedDay===k;
    html+=`<button class="history-item" data-day="${k}" aria-expanded="${isExp}" style="${isExp?'border-radius:var(--rs) var(--rs) 0 0;border-bottom-color:transparent':''}">
      <div class="history-date"><div class="hd-month">${m}</div><div class="hd-day">${d}</div></div>
      <div class="history-info">
        <div class="history-exercises">${exNames.join(', ')||'No record'}</div>
        <div class="history-meta">
          <span class="hm">Sets <strong>${totalSets}</strong></span>
          <span class="hm">Total <strong>${totalReps.toLocaleString()}</strong> reps</span>
          ${totalSeconds?`<span class="hm">Timed exercise <strong>${totalSeconds}</strong>s</span>`:''}
          <span class="hm">${exNames.length} exercises</span>
        </div>
      </div>
      <div class="chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="${isExp?'18 15 12 9 6 15':'6 9 12 15 18 9'}"/></svg></div>
    </button>`;
    if(isExp){
      html+=`<div class="history-detail">`;
      exs.filter(([,e])=>e.sets.some(s=>s.done)).forEach(([id,e])=>{
        const ex=EX_MAP[id]||{name:exerciseName(id),ico:'',isTime:id==='plank'};
        const done=e.sets.filter(s=>s.done);
        const unit=ex.isTime?'s':' reps';
        html+=`<div class="hd-ex-row"><span class="hd-ex-name">${ex.ico} ${ex.name}</span><span class="hd-ex-val">${done.map(s=>s.reps+unit).join(' · ')}</span></div>`;
      });
      html+=`</div>`;
    }
  });
  html+=`</div>`;
  document.getElementById('history-content').innerHTML=html;
  document.querySelectorAll('.history-item').forEach(item=>{
    item.onclick=()=>{const k=item.dataset.day;expandedDay=expandedDay===k?null:k;renderHistory();};
  });
}

/* ─── STATS ─── */
let statsPeriod='week',statsAnchor=TODAY;
function periodRange(anchor=statsAnchor,period=statsPeriod){
  const start=new Date(anchor+'T00:00');
  if(period==='week')start.setDate(start.getDate()-((start.getDay()+6)%7));
  if(period==='month')start.setDate(1);
  const end=new Date(start);
  if(period==='week')end.setDate(end.getDate()+6);
  if(period==='month')end.setMonth(end.getMonth()+1,0);
  return{start:dateKey(start),end:dateKey(end)};
}
function periodSummary(start,end){
  const result={days:0,sets:0,reps:0,exercises:{}};
  Object.entries(DATA.days).filter(([k])=>k>=start&&k<=end).forEach(([,day])=>{
    let worked=false;
    Object.entries(day.exercises||{}).forEach(([id,ex])=>{
      const done=ex.sets.filter(s=>s.done);if(!done.length)return;
      worked=true;
      const item=result.exercises[id]||(result.exercises[id]={sets:0,reps:0,max:0});
      done.forEach(s=>{item.sets++;item.reps+=s.reps;item.max=Math.max(item.max,s.reps);result.sets++;if(id!=='plank')result.reps+=s.reps;});
    });
    if(worked)result.days++;
  });
  return result;
}
function shiftPeriod(direction){
  const d=new Date(periodRange().start+'T00:00');
  if(statsPeriod==='month')d.setMonth(d.getMonth()+direction);
  else d.setDate(d.getDate()+direction*(statsPeriod==='week'?7:1));
  statsAnchor=dateKey(d);renderStats();
}
function exportRecords(){
  const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),...DATA},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='workout-records-'+TODAY+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function cumulativeStats(){
  let html='<details class="cumulative-details"><summary>All-time bests & muscle groups</summary><div class="pr-card">';
  EXERCISES.forEach(ex=>{const pr=getPR(ex.id);html+='<div class="pr-row"><span class="pr-name">'+ex.name+'</span><span class="pr-val">'+(pr===null?'No record':pr+' reps')+'</span></div>';});
  const counts={};
  Object.values(DATA.days).forEach(day=>Object.entries(day.exercises||{}).forEach(([id,e])=>{
    const ex=EX_MAP[id];if(!ex)return;
    const reps=e.sets.filter(s=>s.done).reduce((n,s)=>n+s.reps,0);
    ex.muscles.forEach(m=>{counts[m]=(counts[m]||0)+reps;});
  }));
  const max=Math.max(...Object.values(counts),1);
  html+='</div><div class="muscle-card"><div class="chart-title">Muscle group reps · Groups may overlap</div>';
  Object.entries(counts).sort(([,a],[,b])=>b-a).forEach(([name,reps])=>{html+='<div class="muscle-row"><div class="muscle-hdr"><span class="muscle-name">'+name+'</span><span class="muscle-pct">'+reps.toLocaleString()+' reps</span></div><div class="muscle-track"><div class="muscle-bar" style="width:'+reps/max*100+'%"></div></div></div>';});
  return html+'</div></details>';
}
function renderStats(){
  const range=periodRange();
  const summary=periodSummary(range.start,range.end);
  const prev=new Date(range.start+'T00:00');prev.setDate(prev.getDate()-1);
  const previousRange=periodRange(dateKey(prev));
  const previous=periodSummary(previousRange.start,previousRange.end);
  const diff=summary.reps-previous.reps;
  const label=statsPeriod==='month'?new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric'}).format(new Date(range.start+'T00:00')):statsPeriod==='day'?formatDateKR(range.start):formatDateKR(range.start)+' – '+formatDateKR(range.end);
  const buckets=[];
  if(statsPeriod!=='day'){
    const d=new Date(range.start+'T00:00');
    while(dateKey(d)<=range.end){
      const start=dateKey(d),end=new Date(d);
      if(statsPeriod==='month')end.setDate(Math.min(end.getDate()+6,new Date(end.getFullYear(),end.getMonth()+1,0).getDate()));
      const endKey=dateKey(end);
      buckets.push({label:statsPeriod==='month'?d.getDate()+'~'+end.getDate():d.getMonth()+1+'/'+d.getDate(),reps:periodSummary(start,endKey).reps,current:start<=TODAY&&endKey>=TODAY});
      d.setDate(end.getDate()+1);
    }
  }
  const max=Math.max(...buckets.map(x=>x.reps),1);
  let html='<div class="stats-wrap"><div class="period-tabs" role="group" aria-label="Statistics period">'+
    [['day','Day'],['week','Week'],['month','Month']].map(([value,name])=>'<button data-period="'+value+'" aria-pressed="'+(statsPeriod===value)+'">'+name+'</button>').join('')+
    '</div><div class="period-nav"><button id="period-prev" aria-label="Previous period">‹</button><strong>'+label+'</strong><button id="period-next" aria-label="Next period" '+(range.end>=TODAY?'disabled':'')+'>›</button></div>'+
    '<div class="kpi-grid"><div class="kpi"><div class="kpi-val ac">'+summary.reps.toLocaleString()+'</div><div class="kpi-lbl">Total reps</div></div><div class="kpi"><div class="kpi-val">'+summary.sets+'</div><div class="kpi-lbl">Sets logged</div></div><div class="kpi"><div class="kpi-val">'+summary.days+'</div><div class="kpi-lbl">Workout days</div></div><div class="kpi"><div class="kpi-val">'+Object.keys(summary.exercises).length+'</div><div class="kpi-lbl">Exercises logged</div></div></div>'+
    '<p class="hint" style="margin:0 0 14px">'+(diff>0?'+':'')+diff.toLocaleString()+' reps vs. previous '+statsPeriod+(range.end>=TODAY?' · Current period is in progress.':'')+'</p>';
  if(buckets.length)html+='<div class="chart-card"><div class="chart-title">'+(statsPeriod==='month'?'By date range':'Daily')+' reps</div><div class="bar-chart">'+buckets.map(x=>'<div class="bc-col"><div class="bc-value">'+x.reps+'</div><div class="bc-bar '+(x.current?'today-bar':'past-bar')+'" style="height:'+(x.reps?Math.max(4,Math.round(x.reps/max*82)):0)+'px"></div><div class="bc-lbl">'+x.label+'</div></div>').join('')+'</div></div>';
  html+='<div class="chart-card"><div class="chart-title">Exercise breakdown</div><table class="stats-table"><thead><tr><th scope="col">Exercise</th><th scope="col">Sets</th><th scope="col">Total reps</th><th scope="col">Best</th></tr></thead><tbody>';
  const ids=[...new Set([...EXERCISES.map(ex=>ex.id),...Object.keys(summary.exercises)])];
  ids.forEach(id=>{
    const item=summary.exercises[id]||{sets:0,reps:0,max:0};
    html+='<tr><td>'+exerciseName(id)+'</td><td>'+item.sets+'</td><td>'+item.reps.toLocaleString()+(id==='plank'?'s':'')+'</td><td>'+item.max+(id==='plank'?'s':'')+'</td></tr>';
  });
  const all=periodSummary('0000-01-01',TODAY);
  html+='</tbody></table></div><p class="hint" style="margin:0 0 14px">All time: '+all.days+' days · '+all.sets+' sets · '+all.reps.toLocaleString()+' reps<br>Current streak: '+getStreak()+' days · Best is the highest rep count in a single set.</p>'+cumulativeStats()+'<button class="backup-btn" id="export-records">Export all records</button><p class="hint" style="margin:8px 0 0">Saved in this browser. Records do not automatically sync across devices.</p></div>';
  document.getElementById('stats-content').innerHTML=html;
  document.querySelectorAll('[data-period]').forEach(btn=>btn.onclick=()=>{statsPeriod=btn.dataset.period;statsAnchor=TODAY;renderStats();});
  document.getElementById('period-prev').onclick=()=>shiftPeriod(-1);
  document.getElementById('period-next').onclick=()=>shiftPeriod(1);
  document.getElementById('export-records').onclick=exportRecords;
}

function updateHeader(){
  const d=new Date();
  document.getElementById('hdr-date').textContent=new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',weekday:'long'}).format(d);
  document.getElementById('streak-num').textContent=getStreak();
}

document.querySelectorAll('.tab-btn').forEach(btn=>btn.onclick=()=>switchTab(btn.dataset.tab));
applyTheme(DATA.settings.theme||null);updateHeader();ensureToday();renderToday();
setInterval(()=>{if(dateKey()!==TODAY)location.reload();},60000);
</script>
</html>
